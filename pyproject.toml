[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "projectfoundry"
version = "0.1.0"
description = "Reusable PySide6 and PyVista application foundations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy<2.5",
    "PySide6",
    "pyvista==0.48.4",
    "pyvistaqt==0.12.0",
]

[project.scripts]
projectfoundry-init-instructions = "projectfoundry.scripts.install_instructions:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/projectfoundry"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
